name: Daily NSE Circuit Update

on:
  schedule:
    # Runs Monday to Friday at 3:00 AM UTC (Which is 8:30 AM IST)
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger button

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required libraries
        run: |
          pip install requests pandas

      - name: Execute Python Scraper
        run: |
          python generate_pine_data.py

      - name: Save updated data back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nse_circuit_data.txt
          git commit -m "Auto-update daily NSE Circuit bands" || exit 0
          git push
