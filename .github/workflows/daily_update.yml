name: Auto-update NSE Circuit Bands

on:
  schedule:
    # Runs at 13:00 UTC (6:30 PM IST) every weekday
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Fetch Latest NSE Data
        run: python fetch_circuits.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nse_circuit_data.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily NSE Circuit bands" && git push)
